# Use vi-style keybindings in copy mode
setw -g mode-keys vi

# Start selection with 'v' (like Vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Detect clipboard tool
if-shell "command -v pbcopy >/dev/null 2>&1" \
  "set -g @clipboard 'pbcopy'" \
  "if-shell 'command -v wl-copy >/dev/null 2>&1' \
     'set -g @clipboard \"wl-copy\"' \
     'set -g @clipboard \"xclip -selection clipboard\"'"

# Use it
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@clipboard}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@clipboard}"

# Resize panes with Alt+arrow (no prefix needed), step of 5
bind-key -n M-Left  resize-pane -L 5
bind-key -n M-Right resize-pane -R 5
bind-key -n M-Up    resize-pane -U 5
bind-key -n M-Down  resize-pane -D 5

# Catppuccin Mocha look
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#cba6f7,bold]  #S#[nobold]  #[fg=#45475a]│ "
set -g status-right "#[fg=#89b4fa] #[fg=#a6adc8]#{b:pane_current_path}  #[fg=#45475a]│  #[fg=#a6e3a1] #[fg=#a6adc8]%H:%M "
setw -g window-status-separator "   "
setw -g window-status-format "#[fg=#6c7086]#I #W"
setw -g window-status-current-format "#[fg=#fab387,bold]#I #[fg=#cdd6f4]#W#{?window_zoomed_flag, #[fg=#fab387]󰊓,}"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines heavy
set -g message-style "bg=default,fg=#cba6f7,bold"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g clock-mode-colour "#cba6f7"

# Blank spacer line between the panes and the status bar
set -gu status-format
set -g status 2
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''
